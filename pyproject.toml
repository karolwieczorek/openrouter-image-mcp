[project]
name = "openrouter-image-mcp"
version = "0.1.0"
description = "MCP server that generates and edits images through OpenRouter's Images API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp[cli]>=1.2,<2",
    "pillow>=10,<13",
]

[project.scripts]
openrouter-image-mcp = "openrouter_image_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_image_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
